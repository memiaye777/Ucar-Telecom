<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCAR TECH BAZAAR</title>

<style>
body {font-family:Arial; background:#f5f5f5; margin:0;}
header {display:flex; justify-content:space-between; padding:15px; background:white;}
.container {padding:20px;}
.card {background:white; padding:15px; margin-bottom:10px; border-radius:10px;}
button {padding:10px; border:none; border-radius:8px;}
input {padding:10px; width:100%; margin:5px 0;}
.admin {display:none;}
img {width:100%; border-radius:10px;}
</style>
</head>

<body>

<header>
  <b>UCAR TECH BAZAAR</b>
  <button onclick="login()">Admin</button>
</header>

<div class="container">

<h2>Məhsullar</h2>
<div id="products"></div>

<hr>

<div class="admin" id="adminPanel">
<h3>Yeni məhsul əlavə et</h3>

<input id="name" placeholder="Məhsul adı">
<input id="price" placeholder="Qiymət">
<input type="file" id="image">

<button onclick="addProduct()">Əlavə et</button>
</div>

</div>

<script>
let data = JSON.parse(localStorage.getItem("products")) || [];

function render(){
  let div = document.getElementById("products");
  div.innerHTML = "";
  data.forEach((p,i)=>{
    div.innerHTML += `
      <div class="card">
        <img src="${p.img}">
        <b>${p.name}</b><br>
        ${p.price} ₼<br><br>
        <a href="https://wa.me/994556311274?text=${p.name} almaq istəyirəm">
        <button style="background:green;color:white;">WhatsApp</button>
        </a>
        <button onclick="del(${i})" style="background:red;color:white;">Sil</button>
      </div>
    `;
  });
}

function addProduct(){
  let name = document.getElementById("name").value;
  let price = document.getElementById("price").value;
  let file = document.getElementById("image").files[0];

  let reader = new FileReader();
  reader.onload = function(e){
    data.push({
      name:name,
      price:price,
      img:e.target.result
    });
    localStorage.setItem("products", JSON.stringify(data));
    render();
  }
  if(file) reader.readAsDataURL(file);
}

function del(i){
  data.splice(i,1);
  localStorage.setItem("products", JSON.stringify(data));
  render();
}

function login(){admin.ucar@az
  let pass = prompt("Şifrə:");
  if(pass=="admin0313"){
    document.getElementById("adminPanel").style.display="block";
  }else{
    alert("Yanlış şifrə");
  }
}

render();
</script>

</body>
</html>
