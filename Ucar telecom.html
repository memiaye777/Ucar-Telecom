<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UCAR TECH BAZAAR</title>

<style>
body { font-family: Arial; margin:0; background:#f5f5f5; }
header {
  display:flex; justify-content:space-between; padding:15px;
  background:white; align-items:center;
}
.logo { font-weight:bold; }
button { padding:10px 15px; border:none; border-radius:8px; cursor:pointer; }
.admin { background:black; color:white; }

.container { padding:20px; }
.card {
  background:white; padding:15px; margin-bottom:10px;
  border-radius:10px;
}
input { width:100%; padding:10px; margin:5px 0; }

.hidden { display:none; }

/* WhatsApp button */
.whatsapp {
  position:fixed;
  bottom:20px;
  right:20px;
  background:#25D366;
  color:white;
  padding:15px;
  border-radius:50%;
  font-size:20px;
}
</style>
</head>

<body>

<header>
  <div class="logo">UCAR TECH BAZAAR</div>
  <button class="admin" onclick="showLogin()">Admin giriş</button>
</header>

<div class="container">

  <h1>Məhsullar</h1>
  <div id="products"></div>

  <!-- LOGIN -->
  <div id="login" class="hidden">
    <h2>Daxil olun</h2>
    <input id="email" placeholder="Email">
    <input id="password" type="password" placeholder="Şifrə">
    <button onclick="login()">Daxil ol</button>
  </div>

  <!-- ADMIN PANEL -->
  <div id="adminPanel" class="hidden">
    <h2>Admin Panel</h2>

    <input id="name" placeholder="Məhsul adı">
    <input id="price" placeholder="Qiymət">
    <button onclick="addProduct()">Əlavə et</button>
  </div>

</div>

<!-- WhatsApp düyməsi -->
<a class="whatsapp" href="https://wa.me/994556311274" target="_blank">
  💬
</a>

<script>
let products = JSON.parse(localStorage.getItem("products")) || [
  {name:"iPhone 15", price:"2299₼"},
  {name:"Samsung", price:"1799₼"}
];

function render(){
  const list = document.getElementById("products");
  list.innerHTML="";
  products.forEach((p,i)=>{
    list.innerHTML += `
      <div class="card">
        <b>${p.name}</b><br>
        ${p.price}
        <br><br>
        <a href="https://wa.me/994556311274?text=Salam ${p.name} almaq istəyirəm" target="_blank">
          <button style="background:green;color:white;">WhatsApp ilə sifariş</button>
        </a>
        <br><br>
        <button onclick="deleteProduct(${i})">Sil</button>
      </div>
    `;
  });
}
render();

function deleteProduct(i){
  products.splice(i,1);
  save();
}

function addProduct(){
  const name = document.getElementById("name").value;
  const price = document.getElementById("price").value;
  products.push({name,price});
  save();
}

function save(){
  localStorage.setItem("products", JSON.stringify(products));
  render();
}

function showLogin(){
  document.getElementById("login").classList.remove("hidden");
}

function login(){
  const email = document.getElementById("email").value;
  const pass = document.getElementById("password").value;

  if(email==="admin@ucar.az" && pass==="ucar0313"){
    document.getElementById("adminPanel").classList.remove("hidden");
    document.getElementById("login").classList.add("hidden");
  } else {
    alert("Yanlış giriş");
  }
}
</script>

</body>
</html>
